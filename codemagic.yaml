workflows:
  ios-unsigned-build:
    name: iOS Unsigned IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies and setup iOS
        script: |
          mkdir -p www
          cp index.html www/
          cp icon.png www/
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned IPA
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR
          zip -r DebiKompresor.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/DebiKompresor.ipa